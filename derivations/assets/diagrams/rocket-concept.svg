<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">Backward exhaust produces forward rocket momentum</title><desc id="description">A short ejection interval conserves the momentum of rocket plus exhaust. The rocket mass decreases, so integrating the momentum balance requires retaining its changing mass.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><path d="M180 130 L330 130 L380 175 L330 220 L180 220 Z" fill="#e9f1e5" stroke="#193d37" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="160.000" y1="155.000" x2="95.000" y2="155.000" stroke="#bd661e" stroke-width="3" marker-end="url(#head-bd661e)"/><line x1="135.000" y1="195.000" x2="79.000" y2="195.000" stroke="#bd661e" stroke-width="3" marker-end="url(#head-bd661e)"/><line x1="110.000" y1="155.000" x2="63.000" y2="155.000" stroke="#bd661e" stroke-width="3" marker-end="url(#head-bd661e)"/><line x1="85.000" y1="195.000" x2="47.000" y2="195.000" stroke="#bd661e" stroke-width="3" marker-end="url(#head-bd661e)"/><line x1="320.000" y1="90.000" x2="440.000" y2="90.000" stroke="#235c4e" stroke-width="3" marker-end="url(#head-235c4e)"/><text x="315" y="65" text-anchor="middle" fill="#193d37" font-size="21">rocket gains momentum</text><text x="133" y="280" text-anchor="middle" fill="#bd661e" font-size="21">exhaust backward</text></g></svg>