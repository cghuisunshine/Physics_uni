<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">Circulating charge has a magnetic moment</title><desc id="description">A current loop has a moment normal to its plane. Orbital electron motion can be related to this construction, while intrinsic spin requires an independent quantum input.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><ellipse cx="250" cy="200" rx="115" ry="55" fill="#e9f1e5" stroke="#235c4e" stroke-width="3"/><line x1="250.000" y1="200.000" x2="250.000" y2="60.000" stroke="#bd661e" stroke-width="3" marker-end="url(#head-bd661e)"/><text x="275" y="75" text-anchor="start" fill="#bd661e" font-size="22">μ</text><path d="M145 179 A115 55 0 0 1 335 164" fill="none" stroke="#286a9a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="385" y="210" text-anchor="start" fill="#286a9a" font-size="21">current</text><text x="260" y="330" text-anchor="middle" fill="#193d37" font-size="20">A current loop behaves as a magnetic dipole</text></g></svg>