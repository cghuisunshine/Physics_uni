<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">Image geometry is reused in optical instruments</title><desc id="description">The thin-lens ray construction supplies a real image and a height ratio. Magnifiers, microscopes and telescopes combine such images with the angle subtended at the eye.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><line x1="45.000" y1="180.000" x2="480.000" y2="180.000" stroke="#66756f" stroke-width="1"/><ellipse cx="270" cy="180" rx="16" ry="120" fill="#edf4fa" stroke="#286a9a" stroke-width="2"/><line x1="80.000" y1="180.000" x2="80.000" y2="100.000" stroke="#235c4e" stroke-width="3" marker-end="url(#head-235c4e)"/><line x1="441.000" y1="180.000" x2="441.000" y2="252.000" stroke="#bd661e" stroke-width="3" marker-end="url(#head-bd661e)"/><path d="M80.000,100.000 L270.000,100.000 L441.000,252.000" fill="none" stroke="#bd661e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" id="lens-ray-parallel"/><path d="M80.000,100.000 L270.000,180.000 L441.000,252.000" fill="none" stroke="#235c4e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" id="lens-ray-central"/><circle cx="360.000" cy="180.000" r="4.000" fill="#286a9a" stroke="#286a9a" stroke-width="2"/><text x="360" y="163" text-anchor="middle" fill="#286a9a" font-size="22">F</text><text x="80" y="75" text-anchor="middle" fill="#235c4e" font-size="21">object</text><text x="425" y="295" text-anchor="middle" fill="#bd661e" font-size="21">image</text><text x="260" y="350" text-anchor="middle" fill="#193d37" font-size="21">The rays meet at the same image point</text></g></svg>