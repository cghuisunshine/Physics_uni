<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">Friction opposes the tendency to slide</title><desc id="description">The orange down-slope component of weight tends to cause sliding. The contact friction shown acts up the slope; static friction adjusts until its limiting value is reached.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><line x1="65.000" y1="140.000" x2="450.000" y2="362.000" stroke="#66756f" stroke-width="3"/><g transform="translate(245 198) rotate(30)"><rect x="-40" y="-30" width="80" height="60" fill="#e9f1e5" stroke="#193d37" stroke-width="2"/></g><line x1="245.000" y1="198.000" x2="245.000" y2="305.000" stroke="#286a9a" stroke-width="3" marker-end="url(#head-286a9a)" id="weight"/><line x1="245.000" y1="198.000" x2="297.000" y2="108.000" stroke="#235c4e" stroke-width="3" marker-end="url(#head-235c4e)" id="normal"/><text x="307" y="106" text-anchor="start" fill="#235c4e" font-size="22">N</text><text x="260" y="303" text-anchor="start" fill="#286a9a" font-size="22">mg</text><line x1="245.000" y1="198.000" x2="323.000" y2="243.000" stroke="#bd661e" stroke-width="3" marker-end="url(#head-bd661e)"/><text x="335" y="256" text-anchor="start" fill="#bd661e" font-size="21">mg sin θ</text><line x1="245.000" y1="198.000" x2="167.000" y2="153.000" stroke="#235c4e" stroke-width="3" marker-end="url(#head-235c4e)"/><text x="88" y="135" text-anchor="start" fill="#235c4e" font-size="22">friction</text><text x="260" y="50" text-anchor="middle" fill="#193d37" font-size="22">Resolve weight along the slope</text></g></svg>