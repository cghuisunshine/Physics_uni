<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">A supersonic source produces a tangent cone</title><desc id="description">The source has advanced farther than an earlier sound front can travel. The cone is tangent to those earlier spherical fronts; its half-angle decreases as source speed increases.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><circle cx="440.000" cy="180.000" r="8.000" fill="#bd661e" stroke="#bd661e" stroke-width="2"/><line x1="90.000" y1="80.000" x2="440.000" y2="180.000" stroke="#286a9a" stroke-width="3"/><line x1="90.000" y1="280.000" x2="440.000" y2="180.000" stroke="#286a9a" stroke-width="3"/><circle cx="155.000" cy="180.000" r="78.000" fill="none" stroke="#a3bbcb" stroke-width="2"/><line x1="440.000" y1="180.000" x2="490.000" y2="180.000" stroke="#bd661e" stroke-width="3" marker-end="url(#head-bd661e)"/><text x="245" y="160" text-anchor="start" fill="#286a9a" font-size="22">θ</text><text x="260" y="330" text-anchor="middle" fill="#193d37" font-size="21">A supersonic source outruns its waves</text></g></svg>