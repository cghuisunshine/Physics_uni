<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">Two carts exchange momentum</title><desc id="description">A moving cart collides with a stationary cart and they stick together. Their common motion afterward must carry the same total momentum if the external impulse is negligible.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><text x="40" y="75" text-anchor="start" fill="#193d37" font-size="22">Before</text><line x1="70.000" y1="160.000" x2="465.000" y2="160.000" stroke="#66756f" stroke-width="2"/><text x="40" y="220" text-anchor="start" fill="#193d37" font-size="22">After</text><line x1="70.000" y1="305.000" x2="465.000" y2="305.000" stroke="#66756f" stroke-width="2"/><rect x="120" y="90" width="65" height="65" rx="0" fill="#e9f1e5" stroke="#235c4e" stroke-width="2"/><rect x="300" y="90" width="65" height="65" rx="0" fill="#e9f1e5" stroke="#286a9a" stroke-width="2"/><line x1="140.000" y1="65.000" x2="245.000" y2="65.000" stroke="#235c4e" stroke-width="3" marker-end="url(#head-235c4e)"/><rect x="255" y="235" width="65" height="65" rx="0" fill="#e9f1e5" stroke="#235c4e" stroke-width="2"/><rect x="320" y="235" width="65" height="65" rx="0" fill="#edf4fa" stroke="#286a9a" stroke-width="2"/><line x1="290.000" y1="210.000" x2="355.000" y2="210.000" stroke="#bd661e" stroke-width="3" marker-end="url(#head-bd661e)"/><text x="260" y="345" text-anchor="middle" fill="#193d37" font-size="21">Momentum before = momentum after</text></g></svg>