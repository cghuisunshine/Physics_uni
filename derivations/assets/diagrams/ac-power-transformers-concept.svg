<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">The same changing flux links two windings</title><desc id="description">Winding voltage is proportional to linked turn count in an ideal transformer. Energy conservation then fixes the inverse current ratio and the reflected load resistance.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><rect x="205" y="75" width="110" height="215" rx="0" fill="#e9f1e5" stroke="#66756f" stroke-width="2"/><ellipse cx="175" cy="108" rx="36" ry="18" fill="none" stroke="#286a9a" stroke-width="2"/><ellipse cx="175" cy="143" rx="36" ry="18" fill="none" stroke="#286a9a" stroke-width="2"/><ellipse cx="175" cy="178" rx="36" ry="18" fill="none" stroke="#286a9a" stroke-width="2"/><ellipse cx="175" cy="213" rx="36" ry="18" fill="none" stroke="#286a9a" stroke-width="2"/><ellipse cx="175" cy="248" rx="36" ry="18" fill="none" stroke="#286a9a" stroke-width="2"/><ellipse cx="345" cy="108" rx="36" ry="18" fill="none" stroke="#bd661e" stroke-width="2"/><ellipse cx="345" cy="143" rx="36" ry="18" fill="none" stroke="#bd661e" stroke-width="2"/><ellipse cx="345" cy="178" rx="36" ry="18" fill="none" stroke="#bd661e" stroke-width="2"/><ellipse cx="345" cy="213" rx="36" ry="18" fill="none" stroke="#bd661e" stroke-width="2"/><ellipse cx="345" cy="248" rx="36" ry="18" fill="none" stroke="#bd661e" stroke-width="2"/><text x="100" y="65" text-anchor="middle" fill="#286a9a" font-size="22">primary</text><text x="422" y="65" text-anchor="middle" fill="#bd661e" font-size="22">secondary</text><text x="125" y="175" text-anchor="middle" fill="#286a9a" font-size="22">Np</text><text x="395" y="175" text-anchor="middle" fill="#bd661e" font-size="22">Ns</text><text x="260" y="340" text-anchor="middle" fill="#193d37" font-size="21">A common changing flux links both coils</text></g></svg>