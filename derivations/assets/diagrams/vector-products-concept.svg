<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">Parallel projection and perpendicular area</title><desc id="description">The dot product measures the projection along the orange vector. The cross-product magnitude measures the shaded parallelogram area associated with the two directions.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><path d="M100 265 L300 265 L450 135 L250 135 Z" fill="#edf4fa" stroke="#286a9a" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><line x1="100.000" y1="265.000" x2="250.000" y2="135.000" stroke="#235c4e" stroke-width="3" marker-end="url(#head-235c4e)" id="vector-a"/><line x1="100.000" y1="265.000" x2="300.000" y2="265.000" stroke="#bd661e" stroke-width="3" marker-end="url(#head-bd661e)"/><line x1="250.000" y1="135.000" x2="250.000" y2="265.000" stroke="#66756f" stroke-width="2" stroke-dasharray="6 5"/><text x="165" y="175" text-anchor="start" fill="#235c4e" font-size="22">a</text><text x="285" y="295" text-anchor="start" fill="#bd661e" font-size="22">b</text><text x="260" y="65" text-anchor="middle" fill="#193d37" font-size="22">Dot: parallel projection</text><text x="260" y="335" text-anchor="middle" fill="#193d37" font-size="21">Cross: parallelogram area</text></g></svg>