<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">Microscopic collisions produce pressure</title><desc id="description">The orange velocity toward the wall reverses its normal direction after an elastic collision. The wall receives the opposite momentum change, giving an average force.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><rect x="70" y="80" width="320" height="225" rx="0" fill="none" stroke="#66756f" stroke-width="2"/><circle cx="115.000" cy="120.000" r="6.000" fill="#286a9a" stroke="#286a9a" stroke-width="2"/><circle cx="170.000" cy="245.000" r="6.000" fill="#286a9a" stroke="#286a9a" stroke-width="2"/><circle cx="215.000" cy="120.000" r="6.000" fill="#286a9a" stroke="#286a9a" stroke-width="2"/><circle cx="135.000" cy="200.000" r="6.000" fill="#286a9a" stroke="#286a9a" stroke-width="2"/><circle cx="290.000" cy="260.000" r="6.000" fill="#286a9a" stroke="#286a9a" stroke-width="2"/><circle cx="285.000" cy="165.000" r="6.000" fill="#286a9a" stroke="#286a9a" stroke-width="2"/><circle cx="330.000" cy="190.000" r="10.000" fill="#bd661e" stroke="#bd661e" stroke-width="2"/><line x1="280.000" y1="170.000" x2="375.000" y2="170.000" stroke="#bd661e" stroke-width="3" marker-end="url(#head-bd661e)"/><line x1="375.000" y1="215.000" x2="285.000" y2="215.000" stroke="#286a9a" stroke-width="3" marker-end="url(#head-286a9a)"/><line x1="390.000" y1="80.000" x2="390.000" y2="305.000" stroke="#193d37" stroke-width="6"/><line x1="395.000" y1="190.000" x2="465.000" y2="190.000" stroke="#235c4e" stroke-width="3" marker-end="url(#head-235c4e)"/><text x="440" y="155" text-anchor="middle" fill="#235c4e" font-size="22">force</text><text x="260" y="47" text-anchor="middle" fill="#193d37" font-size="21">Molecules transfer momentum to a wall</text><text x="280" y="145" text-anchor="middle" fill="#bd661e" font-size="21">before</text><text x="285" y="246" text-anchor="middle" fill="#286a9a" font-size="21">after</text></g></svg>