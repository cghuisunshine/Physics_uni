<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">Shell symmetry leaves only the enclosed mass</title><desc id="description">For a spherical body, outer shells exert zero net force at an interior point. With uniform density the enclosed mass grows as the cube of the small radius, giving a linear interior field.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><circle cx="260.000" cy="180.000" r="120.000" fill="#edf4fa" stroke="#286a9a" stroke-width="2"/><circle cx="260.000" cy="180.000" r="67.000" fill="#e9f1e5" stroke="#235c4e" stroke-width="2"/><line x1="260.000" y1="180.000" x2="327.000" y2="180.000" stroke="#235c4e" stroke-width="3" marker-end="url(#head-235c4e)"/><line x1="260.000" y1="180.000" x2="260.000" y2="60.000" stroke="#286a9a" stroke-width="3" marker-end="url(#head-286a9a)"/><text x="295" y="210" text-anchor="start" fill="#235c4e" font-size="22">r</text><text x="278" y="91" text-anchor="start" fill="#286a9a" font-size="22">R</text><text x="260" y="335" text-anchor="middle" fill="#193d37" font-size="21">Only the enclosed mass contributes</text></g></svg>