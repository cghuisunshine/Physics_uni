<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">Induction opposes a change of flux</title><desc id="description">The approaching north pole increases rightward flux through the loop. The induced magnetic field points left, opposing the increase rather than merely opposing any existing field.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><rect x="60" y="140" width="165" height="75" rx="0" fill="#e9f1e5" stroke="#235c4e" stroke-width="2"/><line x1="142.000" y1="140.000" x2="142.000" y2="215.000" stroke="#235c4e" stroke-width="2"/><text x="100" y="186" text-anchor="middle" fill="#235c4e" font-size="22">S</text><text x="185" y="186" text-anchor="middle" fill="#235c4e" font-size="22">N</text><ellipse cx="380" cy="180" rx="38" ry="95" fill="none" stroke="#286a9a" stroke-width="4"/><line x1="150.000" y1="100.000" x2="260.000" y2="100.000" stroke="#bd661e" stroke-width="3" marker-end="url(#head-bd661e)"/><text x="205" y="75" text-anchor="middle" fill="#bd661e" font-size="22">motion</text><line x1="425.000" y1="180.000" x2="315.000" y2="180.000" stroke="#286a9a" stroke-width="3" marker-end="url(#head-286a9a)"/><text x="380" y="305" text-anchor="middle" fill="#286a9a" font-size="21">induced field</text><text x="260" y="350" text-anchor="middle" fill="#193d37" font-size="20">The induced field opposes the flux increase</text></g></svg>