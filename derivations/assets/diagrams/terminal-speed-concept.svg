<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">Balance at terminal speed</title><desc id="description">On the left, drag is smaller than weight and the body speeds up downward. On the right, equal opposing force magnitudes give zero acceleration and constant falling speed.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><circle cx="140.000" cy="165.000" r="19.000" fill="#235c4e" stroke="#235c4e" stroke-width="2"/><line x1="140.000" y1="165.000" x2="140.000" y2="280.000" stroke="#286a9a" stroke-width="3" marker-end="url(#head-286a9a)"/><line x1="140.000" y1="165.000" x2="140.000" y2="120.000" stroke="#bd661e" stroke-width="3" marker-end="url(#head-bd661e)"/><text x="158" y="275" text-anchor="start" fill="#286a9a" font-size="22">mg</text><text x="158" y="105" text-anchor="start" fill="#bd661e" font-size="22">drag</text><text x="140" y="30" text-anchor="middle" fill="#193d37" font-size="22">Speed grows</text><text x="140" y="323" text-anchor="middle" fill="#193d37" font-size="22">a downward</text><circle cx="390.000" cy="165.000" r="19.000" fill="#235c4e" stroke="#235c4e" stroke-width="2"/><line x1="390.000" y1="165.000" x2="390.000" y2="280.000" stroke="#286a9a" stroke-width="3" marker-end="url(#head-286a9a)"/><line x1="390.000" y1="165.000" x2="390.000" y2="50.000" stroke="#bd661e" stroke-width="3" marker-end="url(#head-bd661e)"/><text x="408" y="275" text-anchor="start" fill="#286a9a" font-size="22">mg</text><text x="408" y="105" text-anchor="start" fill="#bd661e" font-size="22">drag</text><text x="390" y="30" text-anchor="middle" fill="#193d37" font-size="22">Balanced</text><text x="390" y="323" text-anchor="middle" fill="#193d37" font-size="22">a = 0</text></g></svg>