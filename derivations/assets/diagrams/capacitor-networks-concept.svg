<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">Parallel capacitors share a voltage</title><desc id="description">Both branches connect to the same pair of nodes. Their voltage differences agree, while their stored charges add to determine the equivalent capacitance.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><line x1="85.000" y1="120.000" x2="240.000" y2="120.000" stroke="#66756f" stroke-width="2"/><line x1="280.000" y1="120.000" x2="435.000" y2="120.000" stroke="#66756f" stroke-width="2"/><line x1="240.000" y1="90.000" x2="240.000" y2="150.000" stroke="#235c4e" stroke-width="5"/><line x1="280.000" y1="90.000" x2="280.000" y2="150.000" stroke="#286a9a" stroke-width="5"/><line x1="85.000" y1="240.000" x2="240.000" y2="240.000" stroke="#66756f" stroke-width="2"/><line x1="280.000" y1="240.000" x2="435.000" y2="240.000" stroke="#66756f" stroke-width="2"/><line x1="240.000" y1="210.000" x2="240.000" y2="270.000" stroke="#235c4e" stroke-width="5"/><line x1="280.000" y1="210.000" x2="280.000" y2="270.000" stroke="#286a9a" stroke-width="5"/><line x1="85.000" y1="120.000" x2="85.000" y2="240.000" stroke="#66756f" stroke-width="2"/><line x1="435.000" y1="120.000" x2="435.000" y2="240.000" stroke="#66756f" stroke-width="2"/><text x="260" y="58" text-anchor="middle" fill="#193d37" font-size="22">Parallel: the same voltage</text><text x="260" y="320" text-anchor="middle" fill="#193d37" font-size="22">The stored charges add</text></g></svg>