<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">A perpendicular force changes angular momentum</title><desc id="description">The force acts perpendicular to the radius at the marked point. Its turning effect depends on the lever arm; a force directed along the radius would give zero torque.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><circle cx="250.000" cy="180.000" r="105.000" fill="#e9f1e5" stroke="#a0b39a" stroke-width="2"/><circle cx="250.000" cy="180.000" r="55.000" fill="none" stroke="#a0b39a" stroke-width="2"/><circle cx="250.000" cy="180.000" r="5.000" fill="#235c4e" stroke="#235c4e" stroke-width="2"/><line x1="250.000" y1="180.000" x2="355.000" y2="180.000" stroke="#66756f" stroke-width="3" marker-end="url(#head-66756f)"/><line x1="355.000" y1="180.000" x2="355.000" y2="78.000" stroke="#bd661e" stroke-width="3" marker-end="url(#head-bd661e)"/><text x="305" y="210" text-anchor="start" fill="#66756f" font-size="22">r</text><text x="378" y="100" text-anchor="start" fill="#bd661e" font-size="22">F</text><text x="260" y="327" text-anchor="middle" fill="#193d37" font-size="21">A perpendicular force turns the body</text></g></svg>