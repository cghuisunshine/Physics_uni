<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">Two reflected paths can acquire different phases</title><desc id="description">One ray reflects at the top interface; another enters the film, reflects at the lower interface and emerges. Both the extra optical path and reflection phase shifts matter.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><rect x="65" y="125" width="390" height="110" rx="0" fill="#edf4fa" stroke="#286a9a" stroke-width="2"/><line x1="65.000" y1="125.000" x2="455.000" y2="125.000" stroke="#286a9a" stroke-width="3"/><line x1="65.000" y1="235.000" x2="455.000" y2="235.000" stroke="#286a9a" stroke-width="3"/><line x1="135.000" y1="45.000" x2="200.000" y2="125.000" stroke="#bd661e" stroke-width="3" marker-end="url(#head-bd661e)"/><line x1="200.000" y1="125.000" x2="265.000" y2="45.000" stroke="#bd661e" stroke-width="3" marker-end="url(#head-bd661e)"/><path d="M200.000,125.000 L265.000,235.000 L330.000,125.000" fill="none" stroke="#235c4e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="330.000" y1="125.000" x2="395.000" y2="45.000" stroke="#235c4e" stroke-width="3" marker-end="url(#head-235c4e)"/><text x="113" y="105" text-anchor="start" fill="#66756f" font-size="22">air</text><text x="110" y="185" text-anchor="start" fill="#286a9a" font-size="22">film n</text><text x="110" y="280" text-anchor="start" fill="#66756f" font-size="22">air</text><line x1="430.000" y1="135.000" x2="430.000" y2="225.000" stroke="#66756f" stroke-width="2"/><text x="446" y="190" text-anchor="start" fill="#66756f" font-size="22">t</text><text x="260" y="340" text-anchor="middle" fill="#193d37" font-size="20">Compare optical path AND reflection phase</text></g></svg>