<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">The Bohr orbit is a historical model</title><desc id="description">The sketch represents the historical circular-orbit model used to calculate the leading energy scale. Modern quantum theory uses stationary wavefunctions rather than literal electron paths.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><circle cx="250.000" cy="185.000" r="100.000" fill="none" stroke="#286a9a" stroke-width="2"/><circle cx="250.000" cy="185.000" r="55.000" fill="none" stroke="#afc4d2" stroke-width="2"/><circle cx="250.000" cy="185.000" r="12.000" fill="#235c4e" stroke="#235c4e" stroke-width="2"/><text x="250" y="168" text-anchor="middle" fill="#235c4e" font-size="22">proton</text><circle cx="350.000" cy="185.000" r="8.000" fill="#bd661e" stroke="#bd661e" stroke-width="2"/><text x="350" y="168" text-anchor="middle" fill="#bd661e" font-size="22">electron</text><line x1="350.000" y1="185.000" x2="350.000" y2="100.000" stroke="#bd661e" stroke-width="3" marker-end="url(#head-bd661e)"/><text x="260" y="350" text-anchor="middle" fill="#193d37" font-size="20">Historical orbit model; not a literal quantum path</text></g></svg>