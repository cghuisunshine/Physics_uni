<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">An inductor resists changes in the current</title><desc id="description">This source-free resistor–inductor loop illustrates current decay after a source is removed. The induced voltage temporarily drives current in the same direction while field energy is dissipated.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><line x1="100.000" y1="90.000" x2="210.000" y2="90.000" stroke="#66756f" stroke-width="2"/><line x1="210.000" y1="90.000" x2="220.000" y2="90.000" stroke="#66756f" stroke-width="2"/><path d="M220.000,90.000 L225.000,100.000 L235.000,80.000 L245.000,100.000 L255.000,80.000 L265.000,100.000 L275.000,80.000 L285.000,100.000 L295.000,80.000 L300.000,90.000 L310.000,90.000" fill="none" stroke="#66756f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="310.000" y1="90.000" x2="420.000" y2="90.000" stroke="#66756f" stroke-width="2"/><line x1="420.000" y1="90.000" x2="420.000" y2="160.000" stroke="#66756f" stroke-width="2"/><line x1="420.000" y1="240.000" x2="420.000" y2="290.000" stroke="#66756f" stroke-width="2"/><line x1="420.000" y1="290.000" x2="100.000" y2="290.000" stroke="#66756f" stroke-width="2"/><line x1="100.000" y1="90.000" x2="100.000" y2="160.000" stroke="#66756f" stroke-width="2"/><line x1="100.000" y1="220.000" x2="100.000" y2="290.000" stroke="#66756f" stroke-width="2"/><text x="260" y="60" text-anchor="middle" fill="#193d37" font-size="22">R</text><line x1="420.000" y1="160.000" x2="420.000" y2="240.000" stroke="#66756f" stroke-width="2"/><path d="M100 160 C125 160 125 175 100 175 C125 175 125 190 100 190 C125 190 125 205 100 205 C125 205 125 220 100 220" fill="none" stroke="#235c4e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="65" y="199" text-anchor="start" fill="#235c4e" font-size="22">L</text><text x="260" y="360" text-anchor="middle" fill="#193d37" font-size="21">Inductance opposes current changes</text><line x1="320.000" y1="125.000" x2="380.000" y2="125.000" stroke="#bd661e" stroke-width="3" marker-end="url(#head-bd661e)"/><text x="350" y="153" text-anchor="middle" fill="#bd661e" font-size="22">I</text></g></svg>