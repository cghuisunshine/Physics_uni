<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">The same volume flow passes every section</title><desc id="description">In a horizontal ideal pipe, the narrower section needs a larger flow speed. Bernoulli energy balance then relates this speed increase to a pressure decrease under the stated assumptions.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><path d="M55 100 L190 100 L285 155 L460 155 L460 225 L285 225 L190 280 L55 280 Z" fill="#edf4fa" stroke="#286a9a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="90.000" y1="190.000" x2="170.000" y2="190.000" stroke="#235c4e" stroke-width="3" marker-end="url(#head-235c4e)"/><line x1="300.000" y1="190.000" x2="435.000" y2="190.000" stroke="#bd661e" stroke-width="3" marker-end="url(#head-bd661e)"/><text x="125" y="80" text-anchor="middle" fill="#193d37" font-size="22">wide</text><text x="370" y="132" text-anchor="middle" fill="#193d37" font-size="22">narrow</text><text x="125" y="320" text-anchor="middle" fill="#235c4e" font-size="22">slower flow</text><text x="370" y="320" text-anchor="middle" fill="#bd661e" font-size="22">faster flow</text></g></svg>