<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">Heat flow and useful work in an engine</title><desc id="description">The working fluid absorbs Qh from the hot reservoir, delivers work, and rejects Qc to the cold reservoir. Energy returns to its initial value after a complete cycle.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><rect x="175" y="35" width="170" height="55" rx="0" fill="#fff0df" stroke="#bd661e" stroke-width="2"/><rect x="175" y="145" width="170" height="65" rx="0" fill="#e9f1e5" stroke="#235c4e" stroke-width="2"/><rect x="175" y="270" width="170" height="55" rx="0" fill="#edf4fa" stroke="#286a9a" stroke-width="2"/><text x="260" y="70" text-anchor="middle" fill="#bd661e" font-size="21">hot reservoir</text><text x="260" y="183" text-anchor="middle" fill="#235c4e" font-size="21">working fluid</text><text x="260" y="305" text-anchor="middle" fill="#286a9a" font-size="21">cold reservoir</text><line x1="260.000" y1="94.000" x2="260.000" y2="140.000" stroke="#bd661e" stroke-width="3" marker-end="url(#head-bd661e)"/><line x1="260.000" y1="215.000" x2="260.000" y2="265.000" stroke="#286a9a" stroke-width="3" marker-end="url(#head-286a9a)"/><line x1="350.000" y1="177.000" x2="465.000" y2="177.000" stroke="#235c4e" stroke-width="3" marker-end="url(#head-235c4e)"/><text x="280" y="121" text-anchor="start" fill="#bd661e" font-size="22">Qh</text><text x="280" y="247" text-anchor="start" fill="#286a9a" font-size="22">Qc</text><text x="410" y="153" text-anchor="middle" fill="#235c4e" font-size="22">work</text></g></svg>