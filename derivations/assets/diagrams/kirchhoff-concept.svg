<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">A junction cannot accumulate charge in steady flow</title><desc id="description">The incoming current splits between two outgoing branches. Their sum must match the input when no net charge builds up at the node.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><circle cx="250.000" cy="180.000" r="7.000" fill="#235c4e" stroke="#235c4e" stroke-width="2"/><line x1="70.000" y1="180.000" x2="240.000" y2="180.000" stroke="#235c4e" stroke-width="3" marker-end="url(#head-235c4e)"/><line x1="255.000" y1="175.000" x2="405.000" y2="90.000" stroke="#286a9a" stroke-width="3" marker-end="url(#head-286a9a)"/><line x1="255.000" y1="185.000" x2="405.000" y2="270.000" stroke="#bd661e" stroke-width="3" marker-end="url(#head-bd661e)"/><text x="140" y="155" text-anchor="start" fill="#235c4e" font-size="22">I in</text><text x="365" y="65" text-anchor="start" fill="#286a9a" font-size="22">I₁</text><text x="365" y="310" text-anchor="start" fill="#bd661e" font-size="22">I₂</text><text x="260" y="350" text-anchor="middle" fill="#193d37" font-size="21">No charge accumulates at the junction</text></g></svg>