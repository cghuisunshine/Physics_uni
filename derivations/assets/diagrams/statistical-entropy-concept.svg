<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">Equal macrostates can contain unequal numbers of microstates</title><desc id="description">For four labelled particles, all four in one specified half has one occupancy assignment. Putting two in each half has six assignments, so the balanced macrostate has greater multiplicity.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><rect x="55" y="100" width="155" height="140" rx="0" fill="none" stroke="#286a9a" stroke-width="2"/><line x1="132.000" y1="100.000" x2="132.000" y2="240.000" stroke="#66756f" stroke-width="2"/><text x="132" y="70" text-anchor="middle" fill="#193d37" font-size="21">4 left, 0 right</text><rect x="310" y="100" width="155" height="140" rx="0" fill="none" stroke="#286a9a" stroke-width="2"/><line x1="387.000" y1="100.000" x2="387.000" y2="240.000" stroke="#66756f" stroke-width="2"/><text x="387" y="70" text-anchor="middle" fill="#193d37" font-size="21">2 left, 2 right</text><circle cx="78.000" cy="135.000" r="7.000" fill="#235c4e" stroke="#235c4e" stroke-width="2"/><circle cx="105.000" cy="135.000" r="7.000" fill="#235c4e" stroke="#235c4e" stroke-width="2"/><circle cx="78.000" cy="195.000" r="7.000" fill="#235c4e" stroke="#235c4e" stroke-width="2"/><circle cx="105.000" cy="195.000" r="7.000" fill="#235c4e" stroke="#235c4e" stroke-width="2"/><circle cx="335.000" cy="135.000" r="7.000" fill="#235c4e" stroke="#235c4e" stroke-width="2"/><circle cx="335.000" cy="195.000" r="7.000" fill="#235c4e" stroke="#235c4e" stroke-width="2"/><circle cx="420.000" cy="135.000" r="7.000" fill="#235c4e" stroke="#235c4e" stroke-width="2"/><circle cx="420.000" cy="195.000" r="7.000" fill="#235c4e" stroke="#235c4e" stroke-width="2"/><text x="132" y="285" text-anchor="middle" fill="#193d37" font-size="22">1 assignment</text><text x="388" y="285" text-anchor="middle" fill="#193d37" font-size="22">6 assignments</text><text x="260" y="345" text-anchor="middle" fill="#193d37" font-size="20">Four labelled particles: choose who is left</text></g></svg>