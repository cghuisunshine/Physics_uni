<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">A moving light clock has a longer light path</title><desc id="description">In the clock rest frame the light travels vertically. In the other frame it follows the longer diagonal route while keeping the same light speed, so more coordinate time passes.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><line x1="65.000" y1="100.000" x2="175.000" y2="100.000" stroke="#286a9a" stroke-width="5"/><line x1="65.000" y1="275.000" x2="175.000" y2="275.000" stroke="#286a9a" stroke-width="5"/><line x1="295.000" y1="100.000" x2="405.000" y2="100.000" stroke="#286a9a" stroke-width="5"/><line x1="295.000" y1="275.000" x2="405.000" y2="275.000" stroke="#286a9a" stroke-width="5"/><line x1="120.000" y1="270.000" x2="120.000" y2="105.000" stroke="#bd661e" stroke-width="3" marker-end="url(#head-bd661e)"/><path d="M300.000,275.000 L350.000,100.000 L400.000,275.000" fill="none" stroke="#bd661e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="300.000" y1="305.000" x2="400.000" y2="305.000" stroke="#235c4e" stroke-width="3" marker-end="url(#head-235c4e)"/><text x="120" y="65" text-anchor="middle" fill="#193d37" font-size="22">at rest</text><text x="350" y="65" text-anchor="middle" fill="#193d37" font-size="22">moving</text><text x="260" y="350" text-anchor="middle" fill="#193d37" font-size="20">Light keeps speed c; the diagonal takes longer</text></g></svg>