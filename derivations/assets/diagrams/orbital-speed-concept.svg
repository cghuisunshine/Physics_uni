<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">Gravity supplies the inward force</title><desc id="description">A satellite moving tangentially continually falls toward the central mass. Gravity bends its path; no separate extra centripetal interaction is added.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><circle cx="235.000" cy="180.000" r="105.000" fill="none" stroke="#a5b49f" stroke-width="2"/><circle cx="235.000" cy="180.000" r="32.000" fill="#e9f1e5" stroke="#235c4e" stroke-width="2"/><text x="235" y="187" text-anchor="middle" fill="#235c4e" font-size="22">M</text><circle cx="340.000" cy="180.000" r="8.000" fill="#286a9a" stroke="#286a9a" stroke-width="2"/><text x="340" y="163" text-anchor="middle" fill="#286a9a" font-size="22">m</text><line x1="340.000" y1="180.000" x2="275.000" y2="180.000" stroke="#235c4e" stroke-width="3" marker-end="url(#head-235c4e)"/><line x1="340.000" y1="180.000" x2="340.000" y2="80.000" stroke="#bd661e" stroke-width="3" marker-end="url(#head-bd661e)"/><text x="365" y="90" text-anchor="start" fill="#bd661e" font-size="22">v</text><text x="285" y="160" text-anchor="start" fill="#235c4e" font-size="21">gravity</text><text x="260" y="335" text-anchor="middle" fill="#193d37" font-size="22">Gravity bends the path</text></g></svg>