<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">Temperature enters through three kinetic components</title><desc id="description">Collisions alone give pressure in terms of mean-square velocity. The three equal quadratic translational energy contributions supply the separate temperature relation.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><circle cx="245.000" cy="215.000" r="12.000" fill="#bd661e" stroke="#bd661e" stroke-width="2"/><line x1="245.000" y1="215.000" x2="420.000" y2="215.000" stroke="#235c4e" stroke-width="3" marker-end="url(#head-235c4e)"/><line x1="245.000" y1="215.000" x2="245.000" y2="65.000" stroke="#286a9a" stroke-width="3" marker-end="url(#head-286a9a)"/><line x1="245.000" y1="215.000" x2="125.000" y2="295.000" stroke="#bd661e" stroke-width="3" marker-end="url(#head-bd661e)"/><text x="440" y="220" text-anchor="start" fill="#235c4e" font-size="22">x</text><text x="260" y="65" text-anchor="start" fill="#286a9a" font-size="22">y</text><text x="100" y="320" text-anchor="start" fill="#bd661e" font-size="22">z</text><text x="270" y="340" text-anchor="middle" fill="#193d37" font-size="21">Three independent quadratic motions</text></g></svg>