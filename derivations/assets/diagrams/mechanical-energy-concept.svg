<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">Potential energy can become kinetic energy</title><desc id="description">In an ideal lossless fall, the same total mechanical energy changes form from gravitational potential to motion. The equal-height bars represent equal energies, not object heights.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><line x1="75.000" y1="270.000" x2="450.000" y2="270.000" stroke="#66756f" stroke-width="2"/><rect x="90" y="95" width="100" height="175" rx="0" fill="#edf4fa" stroke="#193d37" stroke-width="2"/><rect x="330" y="95" width="100" height="175" rx="0" fill="#e9f1e5" stroke="#193d37" stroke-width="2"/><text x="140" y="192" text-anchor="middle" fill="#286a9a" font-size="21">U = mgh</text><text x="380" y="192" text-anchor="middle" fill="#235c4e" font-size="21">K = ½mv²</text><line x1="210.000" y1="180.000" x2="305.000" y2="180.000" stroke="#bd661e" stroke-width="3" marker-end="url(#head-bd661e)"/><text x="260" y="58" text-anchor="middle" fill="#193d37" font-size="22">Same total mechanical energy</text><text x="140" y="315" text-anchor="middle" fill="#193d37" font-size="22">before</text><text x="380" y="315" text-anchor="middle" fill="#193d37" font-size="22">after</text></g></svg>