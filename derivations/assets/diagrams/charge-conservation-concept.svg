<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">Charge is signed and interactions preserve its total</title><desc id="description">Positive and negative charge signs set the force directions. Transferring charge between objects can change each object’s charge while preserving their signed total.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><circle cx="170.000" cy="110.000" r="25.000" fill="#e9f1e5" stroke="#235c4e" stroke-width="2"/><text x="170" y="118" text-anchor="middle" fill="#235c4e" font-size="22">+</text><circle cx="350.000" cy="110.000" r="25.000" fill="#edf4fa" stroke="#286a9a" stroke-width="2"/><text x="350" y="118" text-anchor="middle" fill="#286a9a" font-size="22">+</text><line x1="140.000" y1="110.000" x2="70.000" y2="110.000" stroke="#235c4e" stroke-width="3" marker-end="url(#head-235c4e)"/><line x1="380.000" y1="110.000" x2="450.000" y2="110.000" stroke="#286a9a" stroke-width="3" marker-end="url(#head-286a9a)"/><text x="260" y="173" text-anchor="middle" fill="#193d37" font-size="21">like charges repel</text><circle cx="170.000" cy="265.000" r="25.000" fill="#e9f1e5" stroke="#235c4e" stroke-width="2"/><text x="170" y="273" text-anchor="middle" fill="#235c4e" font-size="22">+</text><circle cx="350.000" cy="265.000" r="25.000" fill="#edf4fa" stroke="#286a9a" stroke-width="2"/><text x="350" y="273" text-anchor="middle" fill="#286a9a" font-size="22">−</text><line x1="200.000" y1="265.000" x2="260.000" y2="265.000" stroke="#235c4e" stroke-width="3" marker-end="url(#head-235c4e)"/><line x1="320.000" y1="265.000" x2="260.000" y2="265.000" stroke="#286a9a" stroke-width="3" marker-end="url(#head-286a9a)"/><text x="260" y="328" text-anchor="middle" fill="#193d37" font-size="21">unlike charges attract</text></g></svg>