<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">A spherical Gaussian surface matches the symmetry</title><desc id="description">The field is radial and equal in magnitude at every point on the concentric spherical surface. This symmetry is what allows the field to leave the flux integral.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><circle cx="260.000" cy="185.000" r="105.000" fill="none" stroke="#286a9a" stroke-width="2"/><circle cx="260.000" cy="185.000" r="12.000" fill="#bd661e" stroke="#bd661e" stroke-width="2"/><text x="260" y="168" text-anchor="middle" fill="#bd661e" font-size="22">Q</text><line x1="315.000" y1="185.000" x2="405.000" y2="185.000" stroke="#235c4e" stroke-width="3" marker-end="url(#head-235c4e)"/><line x1="298.891" y1="223.891" x2="362.530" y2="287.530" stroke="#235c4e" stroke-width="3" marker-end="url(#head-235c4e)"/><line x1="260.000" y1="240.000" x2="260.000" y2="330.000" stroke="#235c4e" stroke-width="3" marker-end="url(#head-235c4e)"/><line x1="221.109" y1="223.891" x2="157.470" y2="287.530" stroke="#235c4e" stroke-width="3" marker-end="url(#head-235c4e)"/><line x1="205.000" y1="185.000" x2="115.000" y2="185.000" stroke="#235c4e" stroke-width="3" marker-end="url(#head-235c4e)"/><line x1="221.109" y1="146.109" x2="157.470" y2="82.470" stroke="#235c4e" stroke-width="3" marker-end="url(#head-235c4e)"/><line x1="260.000" y1="130.000" x2="260.000" y2="40.000" stroke="#235c4e" stroke-width="3" marker-end="url(#head-235c4e)"/><line x1="298.891" y1="146.109" x2="362.530" y2="82.470" stroke="#235c4e" stroke-width="3" marker-end="url(#head-235c4e)"/><text x="260" y="355" text-anchor="middle" fill="#193d37" font-size="21">Same radial field on a concentric sphere</text></g></svg>