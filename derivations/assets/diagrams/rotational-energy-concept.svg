<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">Different radii have different speeds</title><desc id="description">The body shares one angular speed, but a point twice as far from the axis moves twice as fast. This radius dependence produces the squared-radius weighting in moment of inertia.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><circle cx="250.000" cy="180.000" r="105.000" fill="#e9f1e5" stroke="#a0b39a" stroke-width="2"/><circle cx="250.000" cy="180.000" r="55.000" fill="none" stroke="#a0b39a" stroke-width="2"/><circle cx="250.000" cy="180.000" r="5.000" fill="#235c4e" stroke="#235c4e" stroke-width="2"/><line x1="250.000" y1="180.000" x2="355.000" y2="180.000" stroke="#235c4e" stroke-width="3"/><line x1="355.000" y1="180.000" x2="355.000" y2="75.000" stroke="#bd661e" stroke-width="3" marker-end="url(#head-bd661e)"/><line x1="305.000" y1="180.000" x2="305.000" y2="125.000" stroke="#bd661e" stroke-width="3" marker-end="url(#head-bd661e)"/><text x="375" y="115" text-anchor="start" fill="#bd661e" font-size="21">v = ωr</text><text x="260" y="327" text-anchor="middle" fill="#193d37" font-size="21">Farther from the axis → greater speed</text></g></svg>