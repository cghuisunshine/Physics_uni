<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">The field between the plates stores energy</title><desc id="description">The shaded gap represents the field-filled volume. As more charge is separated onto the plates the voltage rises, so the work per additional charge also rises.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><rect x="170" y="90" width="180" height="195" rx="0" fill="#edf4fa" stroke="none" stroke-width="2"/><line x1="165.000" y1="75.000" x2="165.000" y2="300.000" stroke="#235c4e" stroke-width="6"/><line x1="355.000" y1="75.000" x2="355.000" y2="300.000" stroke="#286a9a" stroke-width="6"/><text x="135" y="105" text-anchor="middle" fill="#235c4e" font-size="22">+</text><text x="385" y="105" text-anchor="middle" fill="#286a9a" font-size="22">−</text><line x1="185.000" y1="105.000" x2="335.000" y2="105.000" stroke="#bd661e" stroke-width="3" marker-end="url(#head-bd661e)"/><text x="135" y="170" text-anchor="middle" fill="#235c4e" font-size="22">+</text><text x="385" y="170" text-anchor="middle" fill="#286a9a" font-size="22">−</text><line x1="185.000" y1="170.000" x2="335.000" y2="170.000" stroke="#bd661e" stroke-width="3" marker-end="url(#head-bd661e)"/><text x="135" y="235" text-anchor="middle" fill="#235c4e" font-size="22">+</text><text x="385" y="235" text-anchor="middle" fill="#286a9a" font-size="22">−</text><line x1="185.000" y1="235.000" x2="335.000" y2="235.000" stroke="#bd661e" stroke-width="3" marker-end="url(#head-bd661e)"/><line x1="170.000" y1="325.000" x2="350.000" y2="325.000" stroke="#66756f" stroke-width="2"/><text x="260" y="355" text-anchor="middle" fill="#66756f" font-size="22">gap d</text><text x="260" y="48" text-anchor="middle" fill="#193d37" font-size="21">Uniform field between wide plates</text></g></svg>