<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">A circular aperture produces a diffraction pattern</title><desc id="description">The bright central spot and weaker rings are a schematic Airy pattern, not a scale intensity map. The first dark ring sets the circular-aperture angular resolution criterion.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><circle cx="150.000" cy="180.000" r="75.000" fill="#e9f1e5" stroke="#235c4e" stroke-width="2"/><circle cx="380.000" cy="180.000" r="18.000" fill="none" stroke="#286a9a" stroke-width="5"/><circle cx="380.000" cy="180.000" r="40.000" fill="none" stroke="#286a9a" stroke-width="2"/><circle cx="380.000" cy="180.000" r="61.000" fill="none" stroke="#286a9a" stroke-width="2"/><circle cx="380.000" cy="180.000" r="82.000" fill="none" stroke="#286a9a" stroke-width="2"/><circle cx="380.000" cy="180.000" r="17.000" fill="#286a9a" stroke="#286a9a" stroke-width="2"/><text x="150" y="295" text-anchor="middle" fill="#235c4e" font-size="22">aperture</text><text x="380" y="295" text-anchor="middle" fill="#286a9a" font-size="21">Airy pattern</text><text x="260" y="65" text-anchor="middle" fill="#193d37" font-size="21">A circular opening spreads the wave</text></g></svg>