<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">Power is the rate of transferring work</title><desc id="description">A force along motion transfers work as displacement occurs. Dividing the small work by elapsed time connects instantaneous power to the force and velocity component in the same direction.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><line x1="55.000" y1="245.000" x2="465.000" y2="245.000" stroke="#66756f" stroke-width="2"/><rect x="100" y="170" width="65" height="70" rx="0" fill="#e9f1e5" stroke="#193d37" stroke-width="2"/><rect x="315" y="170" width="65" height="70" rx="0" fill="#e9f1e5" stroke="#193d37" stroke-width="2"/><line x1="130.000" y1="190.000" x2="240.000" y2="190.000" stroke="#235c4e" stroke-width="3" marker-end="url(#head-235c4e)"/><text x="194" y="165" text-anchor="middle" fill="#235c4e" font-size="22">F</text><line x1="125.000" y1="285.000" x2="350.000" y2="285.000" stroke="#bd661e" stroke-width="3" marker-end="url(#head-bd661e)"/><text x="240" y="326" text-anchor="middle" fill="#bd661e" font-size="22">displacement</text><text x="260" y="75" text-anchor="middle" fill="#193d37" font-size="21">Force along motion transfers energy</text></g></svg>