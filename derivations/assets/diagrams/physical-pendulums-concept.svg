<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">The mass distribution affects the restoring motion</title><desc id="description">The rigid body rotates about its pivot while weight acts at its centre of mass. Both the pivot-to-centre distance and the inertia about the pivot determine its small-angle period.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><circle cx="250.000" cy="65.000" r="5.000" fill="#235c4e" stroke="#235c4e" stroke-width="2"/><line x1="250.000" y1="65.000" x2="250.000" y2="275.000" stroke="#66756f" stroke-width="2" stroke-dasharray="5 5"/><line x1="250.000" y1="65.000" x2="350.000" y2="238.000" stroke="#235c4e" stroke-width="5"/><circle cx="350.000" cy="238.000" r="19.000" fill="#e9f1e5" stroke="#235c4e" stroke-width="2"/><line x1="350.000" y1="238.000" x2="350.000" y2="320.000" stroke="#286a9a" stroke-width="3" marker-end="url(#head-286a9a)"/><text x="370" y="313" text-anchor="start" fill="#286a9a" font-size="22">mg</text><text x="310" y="151" text-anchor="start" fill="#235c4e" font-size="22">h</text><path d="M250 125 A60 60 0 0 0 280 117" fill="none" stroke="#66756f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="280" y="150" text-anchor="start" fill="#66756f" font-size="22">θ</text><text x="260" y="352" text-anchor="middle" fill="#193d37" font-size="21">Weight supplies a restoring torque</text></g></svg>