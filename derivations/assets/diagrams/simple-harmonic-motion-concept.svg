<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">The force always restores toward equilibrium</title><desc id="description">The displaced mass feels a spring force back toward the dashed equilibrium position. This force proportional to minus displacement produces harmonic motion.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><line x1="75.000" y1="85.000" x2="75.000" y2="240.000" stroke="#66756f" stroke-width="4"/><path d="M75.000,170.000 L87.000,170.000 L95.000,182.000 L110.000,158.000 L125.000,182.000 L140.000,158.000 L155.000,182.000 L170.000,158.000 L185.000,182.000 L200.000,158.000 L215.000,182.000 L230.000,158.000 L245.000,182.000 L260.000,158.000 L268.000,170.000 L280.000,170.000" fill="none" stroke="#66756f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="280" y="135" width="65" height="70" rx="0" fill="#e9f1e5" stroke="#193d37" stroke-width="2"/><line x1="280.000" y1="100.000" x2="280.000" y2="250.000" stroke="#66756f" stroke-width="2" stroke-dasharray="5 5"/><line x1="315.000" y1="170.000" x2="240.000" y2="170.000" stroke="#235c4e" stroke-width="3" marker-end="url(#head-235c4e)"/><text x="260" y="75" text-anchor="middle" fill="#193d37" font-size="21">Force points toward equilibrium</text><line x1="280.000" y1="280.000" x2="370.000" y2="280.000" stroke="#bd661e" stroke-width="3" marker-end="url(#head-bd661e)"/><text x="330" y="320" text-anchor="start" fill="#bd661e" font-size="22">x</text><text x="185" y="230" text-anchor="start" fill="#66756f" font-size="21">equilibrium</text></g></svg>