<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">Time and space axes depend on the frame</title><desc id="description">The primed frame axes tilt within a spacetime diagram. Different constant-time slices explain why simultaneity and moving lengths must be handled with the full transformation.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><line x1="250.000" y1="290.000" x2="460.000" y2="290.000" stroke="#66756f" stroke-width="3" marker-end="url(#head-66756f)"/><line x1="250.000" y1="290.000" x2="250.000" y2="55.000" stroke="#66756f" stroke-width="3" marker-end="url(#head-66756f)"/><text x="470" y="297" text-anchor="start" fill="#66756f" font-size="22">x</text><text x="238" y="39" text-anchor="start" fill="#66756f" font-size="22">ct</text><line x1="250.000" y1="290.000" x2="65.000" y2="105.000" stroke="#66756f" stroke-width="1" stroke-dasharray="5 5"/><line x1="250.000" y1="290.000" x2="435.000" y2="105.000" stroke="#66756f" stroke-width="1" stroke-dasharray="5 5"/><line x1="250.000" y1="290.000" x2="355.000" y2="80.000" stroke="#235c4e" stroke-width="3" marker-end="url(#head-235c4e)"/><line x1="250.000" y1="290.000" x2="450.000" y2="190.000" stroke="#bd661e" stroke-width="3" marker-end="url(#head-bd661e)"/><text x="368" y="83" text-anchor="start" fill="#235c4e" font-size="22">ct′</text><text x="457" y="180" text-anchor="start" fill="#bd661e" font-size="22">x′</text><text x="260" y="345" text-anchor="middle" fill="#193d37" font-size="20">Different frames slice spacetime differently</text></g></svg>