<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">Pressure differences create buoyancy</title><desc id="description">The arrows at greater depth represent larger pressure. The surrounding fluid gives the immersed block a net upward buoyant force because pressure is larger beneath it.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><rect x="105" y="70" width="290" height="220" rx="0" fill="#edf4fa" stroke="#286a9a" stroke-width="2"/><line x1="105.000" y1="95.000" x2="395.000" y2="95.000" stroke="#286a9a" stroke-width="2" stroke-dasharray="5 5"/><rect x="205" y="155" width="90" height="75" rx="0" fill="#e9f1e5" stroke="#235c4e" stroke-width="2"/><line x1="250.000" y1="225.000" x2="250.000" y2="135.000" stroke="#235c4e" stroke-width="3" marker-end="url(#head-235c4e)"/><text x="310" y="174" text-anchor="start" fill="#235c4e" font-size="21">buoyancy</text><line x1="395.000" y1="125.000" x2="370.000" y2="125.000" stroke="#286a9a" stroke-width="3" marker-end="url(#head-286a9a)"/><line x1="395.000" y1="185.000" x2="350.000" y2="185.000" stroke="#286a9a" stroke-width="3" marker-end="url(#head-286a9a)"/><line x1="395.000" y1="250.000" x2="330.000" y2="250.000" stroke="#286a9a" stroke-width="3" marker-end="url(#head-286a9a)"/><line x1="80.000" y1="95.000" x2="80.000" y2="250.000" stroke="#66756f" stroke-width="2"/><text x="57" y="186" text-anchor="start" fill="#66756f" font-size="22">h</text><text x="260" y="335" text-anchor="middle" fill="#193d37" font-size="22">Pressure increases with depth</text></g></svg>