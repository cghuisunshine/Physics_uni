<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">Normalizable Coulomb states have discrete energies</title><desc id="description">The bound Coulomb levels accumulate below the ionization limit. Radial regularity and normalizability select these energies without a literal circular electron orbit.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><line x1="80.000" y1="300.000" x2="80.000" y2="50.000" stroke="#66756f" stroke-width="3" marker-end="url(#head-66756f)"/><text x="65" y="35" text-anchor="start" fill="#66756f" font-size="22">E</text><line x1="145.000" y1="285.000" x2="390.000" y2="285.000" stroke="#286a9a" stroke-width="2"/><text x="415" y="291" text-anchor="start" fill="#286a9a" font-size="21">n = 1</text><line x1="145.000" y1="133.000" x2="390.000" y2="133.000" stroke="#286a9a" stroke-width="2"/><text x="415" y="139" text-anchor="start" fill="#286a9a" font-size="21">n = 2</text><line x1="145.000" y1="105.000" x2="390.000" y2="105.000" stroke="#286a9a" stroke-width="2"/><text x="415" y="111" text-anchor="start" fill="#286a9a" font-size="21">n = 3</text><line x1="145.000" y1="80.000" x2="390.000" y2="80.000" stroke="#66756f" stroke-width="1" stroke-dasharray="5 5"/><text x="260" y="62" text-anchor="middle" fill="#66756f" font-size="21">ionization limit</text><line x1="270.000" y1="138.000" x2="270.000" y2="277.000" stroke="#bd661e" stroke-width="3" marker-end="url(#head-bd661e)"/><text x="300" y="215" text-anchor="start" fill="#bd661e" font-size="21">photon</text><text x="260" y="350" text-anchor="middle" fill="#193d37" font-size="20">Photon energy equals the level difference</text></g></svg>