"middle" fill="#bd661e" font-size="22">+q</text><line x1="185.000" y1="230.000" x2="285.000" y2="147.000" stroke="#235c4e" stroke-width="3" marker-end="url(#head-235c4e)"/><text x="235" y="166" text-anchor="start" fill="#235c4e" font-size="22">p</text><line x1="65.000" y1="75.000" x2="440.000" y2="75.000" stroke="#66756f" stroke-width="3" marker-end="url(#head-66756f)"/><line x1="65.000" y1="295.000" x2="440.000" y2="295.000" stroke="#66756f" stroke-width="3" marker-end="url(#head-66756f)"/><text x="460" y="80" text-anchor="start" fill="#66756f" font-size="22">E</text><line x1="300.000" y1="135.000" x2="405.000" y2="135.000" stroke="#bd661e" stroke-width="3" marker-end="url(#head-bd661e)"/><line x1="180.000" y1="235.000" x2="75.000" y2="235.000" stroke="#286a9a" stroke-width="3" marker-end="url(#head-286a9a)"/><text x="260" y="350" text-anchor="middle" fill="#193d37" font-size="21">Opposite forces form a turning couple</text></g></svg>