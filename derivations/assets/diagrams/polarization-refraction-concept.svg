<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">A polarizer transmits a projection of the field</title><desc id="description">The transmission axis selects only the parallel electric-field component. Squaring that amplitude projection gives Malus’s intensity factor.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><line x1="90.000" y1="235.000" x2="90.000" y2="95.000" stroke="#bd661e" stroke-width="3" marker-end="url(#head-bd661e)"/><line x1="90.000" y1="165.000" x2="200.000" y2="165.000" stroke="#66756f" stroke-width="3" marker-end="url(#head-66756f)"/><rect x="230" y="75" width="70" height="210" rx="0" fill="#edf4fa" stroke="#286a9a" stroke-width="2"/><line x1="230.000" y1="240.000" x2="300.000" y2="120.000" stroke="#286a9a" stroke-width="4"/><line x1="330.000" y1="165.000" x2="440.000" y2="165.000" stroke="#66756f" stroke-width="3" marker-end="url(#head-66756f)"/><line x1="385.000" y1="215.000" x2="438.000" y2="123.000" stroke="#235c4e" stroke-width="3" marker-end="url(#head-235c4e)"/><text x="95" y="65" text-anchor="middle" fill="#bd661e" font-size="21">incident E</text><text x="260" y="325" text-anchor="middle" fill="#193d37" font-size="21">Only the component along the axis passes</text></g></svg>