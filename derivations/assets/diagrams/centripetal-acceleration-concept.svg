<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">Velocity tangent, acceleration inward</title><desc id="description">At the marked point the orange velocity is tangent to the circle and the green acceleration points toward the centre. Acceleration changes direction even when speed stays constant.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><circle cx="250.000" cy="180.000" r="105.000" fill="none" stroke="#a0b39a" stroke-width="2"/><circle cx="250.000" cy="180.000" r="4.000" fill="#66756f" stroke="#66756f" stroke-width="2"/><text x="250" y="163" text-anchor="middle" fill="#66756f" font-size="22">centre</text><circle cx="355.000" cy="180.000" r="10.000" fill="#235c4e" stroke="#235c4e" stroke-width="2"/><line x1="355.000" y1="180.000" x2="355.000" y2="75.000" stroke="#bd661e" stroke-width="3" marker-end="url(#head-bd661e)" id="velocity"/><line x1="355.000" y1="180.000" x2="265.000" y2="180.000" stroke="#235c4e" stroke-width="3" marker-end="url(#head-235c4e)" id="acceleration"/><text x="374" y="100" text-anchor="start" fill="#bd661e" font-size="22">v</text><text x="300" y="158" text-anchor="start" fill="#235c4e" font-size="22">aᵣ</text><line x1="250.000" y1="183.000" x2="355.000" y2="183.000" stroke="#66756f" stroke-width="2" stroke-dasharray="5 5"/><text x="295" y="218" text-anchor="start" fill="#66756f" font-size="22">r</text><text x="260" y="327" text-anchor="middle" fill="#193d37" font-size="22">Acceleration points inward</text></g></svg>