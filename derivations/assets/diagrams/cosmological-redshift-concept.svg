<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">Expansion increases proper separations</title><desc id="description">The same four comoving locations are farther apart when the scale factor grows. This sketch illustrates a changing distance scale, not galaxies growing in physical size.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><circle cx="105.000" cy="145.000" r="7.000" fill="#286a9a" stroke="#286a9a" stroke-width="2"/><circle cx="175.000" cy="145.000" r="7.000" fill="#286a9a" stroke="#286a9a" stroke-width="2"/><circle cx="105.000" cy="215.000" r="7.000" fill="#286a9a" stroke="#286a9a" stroke-width="2"/><circle cx="175.000" cy="215.000" r="7.000" fill="#286a9a" stroke="#286a9a" stroke-width="2"/><line x1="105.000" y1="145.000" x2="175.000" y2="145.000" stroke="#66756f" stroke-width="1" stroke-dasharray="5 5"/><text x="140" y="80" text-anchor="middle" fill="#193d37" font-size="22">earlier</text><circle cx="320.500" cy="120.500" r="7.000" fill="#286a9a" stroke="#286a9a" stroke-width="2"/><circle cx="439.500" cy="120.500" r="7.000" fill="#286a9a" stroke="#286a9a" stroke-width="2"/><circle cx="320.500" cy="239.500" r="7.000" fill="#286a9a" stroke="#286a9a" stroke-width="2"/><circle cx="439.500" cy="239.500" r="7.000" fill="#286a9a" stroke="#286a9a" stroke-width="2"/><line x1="320.500" y1="120.500" x2="439.500" y2="120.500" stroke="#66756f" stroke-width="1" stroke-dasharray="5 5"/><text x="380" y="80" text-anchor="middle" fill="#193d37" font-size="22">later</text><line x1="240.000" y1="180.000" x2="280.000" y2="180.000" stroke="#bd661e" stroke-width="3" marker-end="url(#head-bd661e)"/><text x="260" y="320" text-anchor="middle" fill="#193d37" font-size="20">Fixed comoving positions; greater proper distance</text></g></svg>