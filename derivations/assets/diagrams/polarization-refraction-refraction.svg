<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">Refraction changes direction when speed changes</title><desc id="description">At a stationary boundary the frequency stays fixed. Entering the higher-index lower medium bends the ray toward the dashed normal, as required by Snell’s law.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><rect x="50" y="180" width="420" height="145" rx="0" fill="#edf4fa" stroke="none" stroke-width="2"/><line x1="50.000" y1="180.000" x2="470.000" y2="180.000" stroke="#286a9a" stroke-width="2"/><line x1="260.000" y1="65.000" x2="260.000" y2="320.000" stroke="#66756f" stroke-width="2" stroke-dasharray="5 5"/><line x1="155.000" y1="55.000" x2="260.000" y2="180.000" stroke="#bd661e" stroke-width="3" marker-end="url(#head-bd661e)"/><line x1="260.000" y1="180.000" x2="317.851" y2="301.977" stroke="#235c4e" stroke-width="3" marker-end="url(#head-235c4e)"/><text x="70" y="145" text-anchor="start" fill="#bd661e" font-size="22">n₁</text><text x="70" y="250" text-anchor="start" fill="#235c4e" font-size="22">n₂ &gt; n₁</text><text x="285" y="117" text-anchor="start" fill="#66756f" font-size="21">normal</text><text x="260" y="355" text-anchor="middle" fill="#193d37" font-size="20">Entering a higher index bends toward normal</text></g></svg>