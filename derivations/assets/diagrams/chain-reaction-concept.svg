<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">Repeated multiplication changes the population</title><desc id="description">In the illustrative generation model each effective neutron produces two effective successors. The counts become one, two, four; actual reactor multiplication includes losses and other effects.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><circle cx="90.000" cy="180.000" r="11.000" fill="#286a9a" stroke="#286a9a" stroke-width="2"/><line x1="105.000" y1="180.000" x2="235.000" y2="110.000" stroke="#286a9a" stroke-width="3" marker-end="url(#head-286a9a)"/><circle cx="250.000" cy="110.000" r="11.000" fill="#286a9a" stroke="#286a9a" stroke-width="2"/><line x1="265.000" y1="110.000" x2="415.000" y2="70.000" stroke="#286a9a" stroke-width="3" marker-end="url(#head-286a9a)"/><circle cx="430.000" cy="70.000" r="9.000" fill="#286a9a" stroke="#286a9a" stroke-width="2"/><line x1="265.000" y1="110.000" x2="415.000" y2="150.000" stroke="#286a9a" stroke-width="3" marker-end="url(#head-286a9a)"/><circle cx="430.000" cy="150.000" r="9.000" fill="#286a9a" stroke="#286a9a" stroke-width="2"/><line x1="105.000" y1="180.000" x2="235.000" y2="250.000" stroke="#286a9a" stroke-width="3" marker-end="url(#head-286a9a)"/><circle cx="250.000" cy="250.000" r="11.000" fill="#286a9a" stroke="#286a9a" stroke-width="2"/><line x1="265.000" y1="250.000" x2="415.000" y2="210.000" stroke="#286a9a" stroke-width="3" marker-end="url(#head-286a9a)"/><circle cx="430.000" cy="210.000" r="9.000" fill="#286a9a" stroke="#286a9a" stroke-width="2"/><line x1="265.000" y1="250.000" x2="415.000" y2="290.000" stroke="#286a9a" stroke-width="3" marker-end="url(#head-286a9a)"/><circle cx="430.000" cy="290.000" r="9.000" fill="#286a9a" stroke="#286a9a" stroke-width="2"/><text x="90" y="330" text-anchor="middle" fill="#193d37" font-size="22">1</text><text x="250" y="330" text-anchor="middle" fill="#193d37" font-size="22">2</text><text x="430" y="330" text-anchor="middle" fill="#193d37" font-size="22">4</text><text x="260" y="45" text-anchor="middle" fill="#193d37" font-size="21">Illustrative multiplication factor k = 2</text></g></svg>