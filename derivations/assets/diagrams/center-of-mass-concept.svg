<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">A mass-weighted balance point</title><desc id="description">A 1 kg mass at zero and a 3 kg mass at 4 m balance at 3 m. The centre of mass lies closer to the heavier mass, rather than halfway between the positions.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><line x1="65.000" y1="215.000" x2="455.000" y2="215.000" stroke="#66756f" stroke-width="3"/><circle cx="90.000" cy="215.000" r="13.000" fill="#286a9a" stroke="#286a9a" stroke-width="2"/><circle cx="430.000" cy="215.000" r="23.000" fill="#235c4e" stroke="#235c4e" stroke-width="2"/><text x="90" y="175" text-anchor="middle" fill="#286a9a" font-size="22">1 kg</text><text x="430" y="175" text-anchor="middle" fill="#235c4e" font-size="22">3 kg</text><path d="M345 219 L326 253 L364 253 Z" fill="#fff0df" stroke="#bd661e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="345" y="290" text-anchor="middle" fill="#bd661e" font-size="21">centre of mass</text><text x="90" y="138" text-anchor="middle" fill="#193d37" font-size="22">x = 0</text><text x="430" y="138" text-anchor="middle" fill="#193d37" font-size="22">x = 4 m</text><text x="260" y="65" text-anchor="middle" fill="#193d37" font-size="21">The heavier side shifts the balance</text></g></svg>