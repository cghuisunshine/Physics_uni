<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">Approximately constant density gives cube-root radius scaling</title><desc id="description">The three nuclei represent mass numbers in the ratio one, two and eight. At constant nuclear matter density their radii scale as one, cube root of two, and two.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><circle cx="100.000" cy="180.000" r="25.000" fill="#e9f1e5" stroke="#235c4e" stroke-width="2"/><text x="100" y="280" text-anchor="middle" fill="#193d37" font-size="22">A</text><circle cx="250.000" cy="180.000" r="31.500" fill="#e9f1e5" stroke="#235c4e" stroke-width="2"/><text x="250" y="280" text-anchor="middle" fill="#193d37" font-size="22">2A</text><circle cx="410.000" cy="180.000" r="50.000" fill="#e9f1e5" stroke="#235c4e" stroke-width="2"/><text x="410" y="280" text-anchor="middle" fill="#193d37" font-size="22">8A</text><text x="260" y="75" text-anchor="middle" fill="#193d37" font-size="21">Eight times the volume → twice the radius</text></g></svg>