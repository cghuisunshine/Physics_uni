<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">Rolling combines translation and rotation</title><desc id="description">The wheel centre moves down the slope while the wheel rotates. Under no slip the contact point is instantaneously at rest relative to the fixed slope; the drawn wheel motion is schematic.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><line x1="65.000" y1="140.000" x2="450.000" y2="362.000" stroke="#66756f" stroke-width="3"/><circle cx="245.000" cy="184.000" r="50.000" fill="#e9f1e5" stroke="#193d37" stroke-width="2"/><line x1="195.000" y1="184.000" x2="295.000" y2="184.000" stroke="#235c4e" stroke-width="2"/><line x1="245.000" y1="184.000" x2="327.270" y2="231.500" stroke="#bd661e" stroke-width="3" marker-end="url(#head-bd661e)"/><text x="351" y="226" text-anchor="start" fill="#bd661e" font-size="22">vcm</text><circle cx="220.000" cy="227.000" r="5.000" fill="#286a9a" stroke="#286a9a" stroke-width="2"/><text x="220" y="210" text-anchor="middle" fill="#286a9a" font-size="22">contact</text><text x="90" y="65" text-anchor="start" fill="#193d37" font-size="22">Translation + rotation</text><text x="337" y="134" text-anchor="start" fill="#235c4e" font-size="22">ω</text><path d="M265 145 A44 44 0 0 1 285 200" fill="none" stroke="#235c4e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></g></svg>