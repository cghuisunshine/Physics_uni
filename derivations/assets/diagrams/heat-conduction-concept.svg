<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title description"><title id="title">Steady energy flow through a slab</title><desc id="description">The hot and cold faces set a temperature gradient across a finite thickness. In steady one-dimensional conduction, the same power crosses every internal section.</desc><defs><marker id="head-235c4e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#235c4e" stroke-width="1.5"/></marker><marker id="head-286a9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#286a9a" stroke-width="1.5"/></marker><marker id="head-bd661e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bd661e" stroke-width="1.5"/></marker><marker id="head-66756f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66756f" stroke-width="1.5"/></marker><marker id="head-193d37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#193d37" stroke-width="1.5"/></marker></defs><rect width="520" height="380" fill="#fff"/><g font-family="Arial,DejaVu Sans,sans-serif" font-weight="400"><rect x="175" y="85" width="175" height="215" rx="0" fill="#edf4fa" stroke="#286a9a" stroke-width="2"/><line x1="175.000" y1="85.000" x2="175.000" y2="300.000" stroke="#bd661e" stroke-width="7"/><line x1="350.000" y1="85.000" x2="350.000" y2="300.000" stroke="#286a9a" stroke-width="7"/><line x1="200.000" y1="190.000" x2="325.000" y2="190.000" stroke="#bd661e" stroke-width="3" marker-end="url(#head-bd661e)"/><text x="110" y="180" text-anchor="middle" fill="#bd661e" font-size="22">hot</text><text x="405" y="180" text-anchor="middle" fill="#286a9a" font-size="22">cold</text><text x="260" y="340" text-anchor="middle" fill="#193d37" font-size="21">Heat flows down the temperature gradient</text></g></svg>